name: CI
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  test:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.27"]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1

      - name: Build
        run: go build -v .

      - name: Test
        run: go test -v ./...
