version: "2"

linters:
  # standard is golangci-lint's own default set.
  default: standard
  enable:
    - copyloopvar
    - err113
    - errorlint
    - gocritic
    - intrange
    - misspell
    - perfsprint
    - predeclared
    - revive
    - unconvert
    - usestdlibvars

formatters:
  # Formatting is not checked by default, so drift reaches master unnoticed.
  enable:
    - gofumpt
